# Minimal chat-only composition. Merge these entries into an existing Harness
# app or use the programmatic runtime.mjs example. Set DSH_KOISHI_TOKEN and
# DEEPSEEK_API_KEY in the process environment before starting.

- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek"
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: agent-spine
  name: "@deepseek-ai/dsh-agent-spine-demo"
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: |
      你是一个由 DeepSeek Harness 驱动的 Koishi 聊天助手。
      请直接、准确且友善地回答，不要声称拥有未配置的工具。
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: koishi-gateway
  name: dsh-plugin-koishi
  config:
    host: 127.0.0.1
    port: 8787
    tokenEnv: DSH_KOISHI_TOKEN
    provider: deepseek-official
    model: deepseek-v4-flash
    maxTokens: 8192
    workspacePath: .
    sessionScope: channel
    includeSenderInGroups: true
    allowedChannels:
      # Replace both values with the actual Koishi route before starting.
      - platform: onebot
        channelId: CHANGE_ME
        isDirect: false
    maxInputChars: 12000
    maxBodyBytes: 131072
    turnTimeoutMs: 180000
    maxPendingPerSession: 8
    maxSessions: 128
    idleTtlMs: 1800000
    dedupeTtlMs: 300000
    maxDedupeEntriesPerSession: 256
