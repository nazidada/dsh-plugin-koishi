name: Bug report
description: 报告可复现的非安全问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请不要公开提交，改用 Security → Report a vulnerability。
        请删除 Token、Authorization Header、消息正文和真实用户/频道 ID。
  - type: input
    id: version
    attributes:
      label: 项目版本或 Commit
      placeholder: 0.1.0 / commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: Node、操作系统、Koishi 与 DeepSeek Harness 版本
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: 部署拓扑
      description: 同机回环、HTTPS 代理、VPN 等；不要提供 Secret
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与脱敏错误码
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这不是需要私密报告的安全漏洞
          required: true
        - label: 我已删除 Token、Authorization Header、消息正文和真实身份 ID
          required: true
        - label: 我已搜索现有 Issue
          required: true
