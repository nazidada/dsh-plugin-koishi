name: Feature request
description: 提议一个有明确使用场景的改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述真实部署或用户场景，不要只写实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 协议、安全与兼容性影响
      description: 是否涉及新字段、权限、网络暴露、持久化或隐私
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已阅读 README 的当前限制和 PLAN 的非目标
          required: true
